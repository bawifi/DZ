<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные кнопки и карточки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="menu" aria-label="Основная навигация">
            <a href="#home">Главная</a>
            <a href="#cards">Картощки</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <h1>Кнопки и карточки</h1>
            <a class="btn" href="#cards">Посмотреть карточку</a>
        </section>

        <section class="cards-section" id="cards" aria-label="Пример карточки">
            <article class="card">
                <span class="card-number">01</span>
                <h2>Наведение и нажатие</h2>
                <p>Наведи курсор, вау, эффекты, круууто.</p>
                <button class="btn" type="button">Попробовать</button>
            </article>
        </section>
    </main>
</body>
</html>
